    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }
      body { margin: 0; overflow-x: hidden; background: #07090F; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      input, select, button, textarea { font-family: inherit; }

      @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
      @keyframes fadeInUp  { from { opacity: 0; transform: translateX(-50%) translateY(16px) } to { opacity: 1; transform: translateX(-50%) translateY(0) } }
      @keyframes slideInRight { from { transform: translateX(100%) } to { transform: translateX(0) } }
      @keyframes pageIn    { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes toastIn   { from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9) } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1) } }
      @keyframes scaleIn   { from { opacity: 0; transform: scale(0.94) } to { opacity: 1; transform: scale(1) } }
      @keyframes pulse     { 0%,100% { opacity: 1 } 50% { opacity: 0.5 } }
      @keyframes spin      { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
      @media print {
        .no-print { display: none !important; }
