<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0F18" />
    <title>פיצה טוסקנה - מערכת ניהול</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; overflow-x: hidden; background: #0D0F18; font-family: 'Heebo', sans-serif; }
      input, select, button { font-family: inherit; font-size: 15px; }
      input[type="date"], input[type="month"] {
        -webkit-appearance: none;
        appearance: none;
        height: 46px !important;
        min-height: 46px !important;
        max-height: 46px !important;
        line-height: 46px;
        overflow: hidden;
      }
      input[type="date"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        text-align: right;
        margin: 0;
      }
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="month"]::-webkit-calendar-picker-indicator {
        opacity: 0.5;
        filter: invert(1);
        cursor: pointer;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 4px; }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateX(-50%) translateY(10px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to   { transform: translateX(0); }
      }
      @media print {
        .no-print { display: none !important; }
        body { background: #fff; color: #000; }
      }
    </style>
